[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isochrone-tool"
version = "1.0.0"
description = "开源等时圈绘制工具：百度真实路况 + IDW 插值 + folium 可交互地图（无需 ArcGIS Pro）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "the isochrone_tool authors" }]
keywords = ["isochrone", "baidu-map", "gis", "folium", "travel-time"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "scipy>=1.11",
  "folium>=0.16",
  "aiohttp>=3.9",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "contourpy>=1.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
isochrone = "isochrone:main"
picker = "picker:main"

[tool.setuptools]
py-modules = ["isochrone", "picker"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use("Agg") 必须先于 pyplot 导入，其后 imports 均有 noqa 之外的整体豁免
"isochrone.py" = ["E402"]
# picker.py 内嵌 JS 字符串单行较长
"picker.py" = ["E501"]
